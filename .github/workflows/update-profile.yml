name: Project Marvel — Telemetry Sync & Validation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # Auto-sync live GitHub telemetry and regenerate Command Center SVGs daily at 00:15 UTC
    - cron: '15 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  telemetry-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Build & Font Subsetting Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow fonttools brotli

      - name: Refresh Live Telemetry & Rebuild SVGs (Scheduled / Manual)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/fetch_telemetry.py
          python scripts/build_profile.py --skip-gifs

      - name: Validate Self-Contained SVG & Source Assets
        run: python scripts/validate_assets.py

      - name: Validate README Integrity & Data Provenance
        run: python scripts/validate_readme.py

      - name: Commit Updated Telemetry & SVGs
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/telemetry.json assets/ README.md
          if ! git diff --cached --quiet; then
            git commit -m "chore(telemetry): auto-sync live GitHub command center metrics"
            git push
          fi
